[project]
name = "arl5-simplified"
version = "1.0.0"
description = "Read-only ARL-5 MES sizing and systemic-event monitor"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "apscheduler>=3.11,<4",
  "authlib>=1.6,<2",
  "cryptography>=45,<47",
  "exchange-calendars>=4.11,<5",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "ibapi>=9.81.1.post1",
  "jinja2>=3.1,<4",
  "joserfc>=1.3,<2",
  "openai>=2.0,<3",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
arl5-simplified = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ibapi.*", "exchange_calendars.*", "apscheduler.*"]
ignore_missing_imports = true
